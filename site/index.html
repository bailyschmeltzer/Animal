<!-- site/index.html -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d1117" />
  <title>Road Trip Animal Game</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d1117;
      --panel: #121418;
      --border: #222833;
      --text: #e6edf3;
      --muted: #9da7b3;
      --accent: #3b82f6;
      --danger: #ef4444;
      --success: #22c55e;
      --btn: #1a1f29;
      --btn2: #232a36;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", sans-serif; }
    a { color: var(--accent); text-decoration: none; }

    .wrap { max-width: 980px; margin: 0 auto; padding: 12px; display: flex; flex-direction: column; gap: 12px; }

    header.app {
      display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center;
    }
    .title { font-weight: 800; font-size: 18px; }
    .now { font-size: 12px; color: var(--muted); text-align: right; }

    .room {
      display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center;
      background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 10px;
    }
    .room input {
      width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border);
      background: #0f1320; color: var(--text);
    }
    .room button {
      padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--btn2); color: var(--text);
    }

    .players {
      display: grid;
      grid-template-columns: 1fr 1fr; /* Two players visible side-by-side on mobile */
      gap: 10px;
      align-items: start;
    }

    .player {
      display: flex; flex-direction: column; gap: 10px;
      background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 12px;
    }

    .header {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .name { font-weight: 800; font-size: 16px; }
    .score { font-weight: 900; font-size: 28px; }

    .wins { font-size: 12px; color: var(--muted); }

    .buttons {
      display: grid; grid-template-columns: 1fr; gap: 8px; /* single column inside each player */
    }
    .buttons button, .footer button, .room button, .actions button {
      width: 100%; padding: 10px 12px; font-size: 16px; border-radius: 10px; border: 1px solid var(--border); background: var(--btn); color: var(--text);
    }
    .buttons button.animal { background: var(--btn2); }
    .buttons button.danger { background: #22171a; border-color: #3a2227; color: #ffb4c0; }
    .footer { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
    .footer button.reset { background: #221c17; border-color: #3a2a22; color: #ffd2b3; }

    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .install { background: #182235; border-color: #223452; }

    @media (max-width: 420px) {
      .player { padding: 10px; }
      .name { font-size: 15px; }
      .score { font-size: 24px; }
      .buttons button { padding: 9px 10px; font-size: 15px; }
      .players { gap: 8px; }
    }
    @media (max-width: 360px) {
      .players { column-gap: 6px; }
      .score { font-size: 22px; }
      .buttons { gap: 6px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="app">
      <div class="title">🐮 Road Trip Animal Game</div>
      <div class="now" id="now"></div>
    </header>

    <section class="room">
      <input id="room" type="text" placeholder="Room code (letters/numbers)" inputmode="latin" autocomplete="one-time-code" />
      <button id="saveRoom">Use Code</button>
    </section>

    <section class="players">
      <section class="player" data-player="baily">
        <div class="header">
          <div class="name">Baily</div>
          <div class="score" id="score-baily">0</div>
        </div>
        <div class="buttons">
          <button class="animal" data-delta="5"   data-player="baily">🐄 +5 Cow</button>
          <button class="animal" data-delta="10"  data-player="baily">🐎 +10 Horse</button>
          <button class="animal" data-delta="50"  data-player="baily">🐕 +50 Dog</button>
          <button class="animal" data-delta="100" data-player="baily">🐈 +100 Cat</button>
          <button class="animal" data-delta="1000" data-player="baily">🦌 +1000 Deer</button>
          <button class="danger" data-graveyard="1" data-player="baily">🪦 Graveyard (reset)</button>
        </div>
        <div class="footer">
          <button class="reset" data-reset="1" data-player="baily">Reset Score</button>
          <div class="wins">Wins: <span id="wins-baily">0</span></div>
        </div>
      </section>

      <section class="player" data-player="taylor">
        <div class="header">
          <div class="name">Taylor</div>
          <div class="score" id="score-taylor">0</div>
        </div>
        <div class="buttons">
          <button class="animal" data-delta="5"   data-player="taylor">🐄 +5 Cow</button>
          <button class="animal" data-delta="10"  data-player="taylor">🐎 +10 Horse</button>
          <button class="animal" data-delta="50"  data-player="taylor">🐕 +50 Dog</button>
          <button class="animal" data-delta="100" data-player="taylor">🐈 +100 Cat</button>
          <button class="animal" data-delta="1000" data-player="taylor">🦌 +1000 Deer</button>
          <button class="danger" data-graveyard="1" data-player="taylor">🪦 Graveyard (reset)</button>
        </div>
        <div class="footer">
          <button class="reset" data-reset="1" data-player="taylor">Reset Score</button>
          <div class="wins">Wins: <span id="wins-taylor">0</span></div>
        </div>
      </section>
    </section>

    <section class="actions">
      <button id="install" class="install" hidden>Install App</button>
      <button id="clear" class="danger">Clear Local Cache</button>
    </section>
  </div>

  <script>
    // Same-origin API (served by the Worker)
    const API_URL = '';

    const els = {
      now: document.getElementById('now'),
      room: document.getElementById('room'),
      saveRoom: document.getElementById('saveRoom'),
      score: {
        baily: document.getElementById('score-baily'),
        taylor: document.getElementById('score-taylor'),
      },
      wins: {
        baily: document.getElementById('wins-baily'),
        taylor: document.getElementById('wins-taylor'),
      },
      install: document.getElementById('install'),
      clear: document.getElementById('clear'),
    };

    const state = {
      code: '',
      score: { baily: 0, taylor: 0 },
      wins: { baily: 0, taylor: 0 },
      updatedAt: 0,
    };

    // Time display
    function tick() {
      const d = new Date();
      els.now.textContent = d.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
    }
    setInterval(tick, 30000); tick();

    // Room code handling
    function readCodeFromURL() {
      const u = new URL(location.href);
      const q = (u.searchParams.get('code') || '').trim();
      const h = (u.hash || '').replace(/^#/, '').trim();
      return q || h || '';
    }
    function writeCodeToURL(code) {
      const u = new URL(location.href);
      if (code) u.searchParams.set('code', code); else u.searchParams.delete('code');
      history.replaceState(null, '', u.toString());
    }

    function render() {
      els.score.baily.textContent = state.score.baily;
      els.score.taylor.textContent = state.score.taylor;
      els.wins.baily.textContent = state.wins.baily;
      els.wins.taylor.textContent = state.wins.taylor;
      els.room.value = state.code;
    }

    function resetScore(player) {
      state.score[player] = 0;
      render();
    }

    function addScore(player, delta) {
      state.score[player] = Math.max(0, state.score[player] + delta);
      if (state.score[player] >= 1000) {
        // Player wins the game
        state.wins[player] += 1;
        state.score.baily = 0;
        state.score.taylor = 0;
        state.updatedAt = Date.now();
        render();
        pushWins().catch(() => {});
      } else {
        render();
      }
    }

    // Buttons: animal, graveyard, reset
    document.body.addEventListener('click', (e) => {
      const btn = e.target.closest('button');
      if (!btn) return;

      if (btn === els.saveRoom) {
        const v = (els.room.value || '').trim();
        state.code = v.toUpperCase();
        writeCodeToURL(state.code);
        render();
        pullWins().catch(() => {});
        return;
      }

      if (btn.dataset && btn.dataset.player) {
        const player = btn.dataset.player;
        if (btn.dataset.delta) {
          addScore(player, parseInt(btn.dataset.delta, 10));
          return;
        }
        if (btn.dataset.graveyard) {
          resetScore(player);
          return;
        }
        if (btn.dataset.reset) {
          resetScore(player);
          return;
        }
      }

      if (btn === els.clear) {
        caches && caches.keys && caches.keys().then(keys => Promise.all(keys.map(k => caches.delete(k))));
        localStorage.clear();
        alert('Local cache cleared.');
        return;
      }
    });

    // API calls
    async function pullWins() {
      if (!state.code) return;
      const url = (API_URL || '') + '/wins?code=' + encodeURIComponent(state.code);
      const r = await fetch(url, { headers: { 'Accept': 'application/json' } });
      if (!r.ok) throw new Error('pull failed');
      const j = await r.json();
      if (j && j.code) {
        state.wins.baily = Number(j.baily || 0);
        state.wins.taylor = Number(j.taylor || 0);
        state.updatedAt = Number(j.updatedAt || Date.now());
        render();
      }
    }

    async function pushWins() {
      if (!state.code) return;
      const url = (API_URL || '') + '/wins';
      const body = {
        code: state.code,
        baily: state.wins.baily,
        taylor: state.wins.taylor,
        updatedAt: Date.now(),
      };
      const r = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify(body),
      });
      if (!r.ok) throw new Error('push failed');
      const j = await r.json();
      // Server may win conflict; accept server truth
      state.wins.baily = Number(j.baily || 0);
      state.wins.taylor = Number(j.taylor || 0);
      state.updatedAt = Number(j.updatedAt || Date.now());
      render();
    }

    // Init
    (async function init() {
      state.code = (readCodeFromURL() || '').toUpperCase();
      render();
      if (state.code) {
        try { await pullWins(); } catch {}
      }
    })();

    // Refresh wins on focus
    window.addEventListener('focus', () => { if (state.code) pullWins().catch(() => {}); });

    // PWA install prompt
    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      els.install.hidden = false;
    });
    els.install.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      els.install.hidden = true;
    });

    // Service worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
